name: Robot de noticias - Préstamo BID al Día

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer noticias reales del caso
        run: node robot/robot.mjs
      - name: Guardar si hubo cambios
        run: |
          git config user.name "Robot Vibras Positivas HM"
          git config user.email "robot@vibraspositivashm.com"
          git add data/noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') hora Colombia"
            git pull --rebase
            git push
          fi
